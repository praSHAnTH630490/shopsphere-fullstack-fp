# =================================================================
# Render Blueprint Specification — ShopSphere Full-Stack Application
# Docs: https://render.com/docs/blueprint-spec
# =================================================================

services:
  # -------------------------------------------------------------
  # 1. Spring Boot 3 Backend Web Service
  # -------------------------------------------------------------
  - type: web
    name: shopsphere-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/products
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: APP_JWT_SECRET
        generateValue: true
      - key: APP_JWT_EXPIRATION
        value: 86400000
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  # -------------------------------------------------------------
  # 2. React 19 + Vite Frontend Static Site
  # -------------------------------------------------------------
  - type: web
    name: shopsphere-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
