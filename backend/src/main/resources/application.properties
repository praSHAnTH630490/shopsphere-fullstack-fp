# ==========================================
# APPLICATION
# ==========================================

spring.application.name=online-store


# ==========================================
# SERVER
# ==========================================

server.port=${PORT:8080}


# ==========================================
# DATABASE
# ==========================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/online_store?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false


# ==========================================
# LOGGING
# ==========================================

logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=WARN


# ==========================================
# SECURITY & JWT CONFIGURATION
# ==========================================

app.jwt.secret=${APP_JWT_SECRET:uA64u4j1e/BeIT1CP8wO43jrhGxxy7lkK3VVMEYadyo=}
app.jwt.expiration=${APP_JWT_EXPIRATION:86400000}

# ==========================================
# CORS CONFIGURATION
# ==========================================

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
